  /* 背景图上的一层轻微暗化遮罩，保证菜单文字可读 */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: 0;
    background: rgba(8, 10, 16, 0.42);
    pointer-events: none;
  }

  /* ===== 菜单容器：五列并排 ===== */
  .clickgui {
    position: relative;
    z-index: 1;
    display: flex;
    gap: 18px;
    width: 100%;
    height: 100%;
    padding: 40px 30px;
    align-items: flex-start;
    justify-content: center;
    zoom: 1;
    transform-origin: center top;
  }

  /* ===== 分类卡片 ===== */
  .panel {
    width: 210px;
    min-width: 210px;
    background: rgba(26, 26, 29, 0.86);
    border: 1px solid rgba(255, 255, 255, 0.07);
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
    display: flex;
    flex-direction: column;
    max-height: calc(100vh - 80px);
  }

  /* 标题栏 */
  .panel-header {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 14px 12px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    color: #fff;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 1px;
  }
  .panel-header .icon {
    display: flex;
    align-items: center;
  }
  .panel-header .icon svg {
    height: 18px;
    width: auto;
    display: block;
  }

  /* 模块列表 */
  .module-list {
    list-style: none;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 6px 0;
  }
  .module-list::-webkit-scrollbar { width: 4px; }
  .module-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 2px; }

  /* 单个模块 */
  .module {
    position: relative;
    text-align: center;
    padding: 9px 10px;
    font-size: 13px;
    font-weight: 400;
    color: #cfcfd3;
    background: transparent;
    cursor: pointer;
    outline: none;
    -webkit-tap-highlight-color: transparent;
    transition: color 0.12s ease;
  }
  /* 关闭态悬停：不留任何淡白背景 */
  .module:not(.on):not(.partial):not(.pink):hover { background: transparent; }

  /* 开启：绿色高亮 */
  .module.on {
    background: linear-gradient(90deg, #8df5ab, #57e084);
    color: #06280f;
    font-weight: 600;
  }
  .module.on:hover { background: linear-gradient(90deg, #9cf7b7, #66e891); }

  /* 部分启用 / 选中：粉紫渐变 */
  .module.partial {
    background: linear-gradient(90deg, #b8f3cf, #f2c2e4);
    color: #3a1230;
    font-weight: 600;
  }
  .module.partial:hover { background: linear-gradient(90deg, #c6f6d9, #f6d0ea); }

  /* 关闭态粉色标记（参考图 No Filter） */
  .module.pink {
    background: #f08ac2;
    color: #fff;
    font-weight: 600;
  }
  .module.pink:hover { background: #f59ccb; }

  /* ===== 悬停提示 ===== */
  .module .tooltip {
    position: absolute;
    left: calc(100% + 10px);
    top: 50%;
    transform: translateY(-50%);
    background: rgba(15, 15, 17, 0.95);
    border: 1px solid rgba(255, 255, 255, 0.12);
    color: #eee;
    font-size: 12px;
    font-weight: 400;
    white-space: nowrap;
    padding: 6px 10px;
    border-radius: 6px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.12s ease;
    z-index: 99;
  }
  .module:hover .tooltip { opacity: 1; }
  /* 第一列 tooltip 放左侧避免溢出 */
  .panel:first-child .module .tooltip {
    left: auto;
    right: calc(100% + 10px);
  }

  /* ===== 手动缩放控件 ===== */
  .zoom-controls {
    position: fixed;
    right: 20px;
    bottom: 20px;
    display: flex;
    align-items: center;
    gap: 6px;
    background: rgba(26, 26, 29, 0.86);
    border: 1px solid rgba(255, 255, 255, 0.07);
    border-radius: 10px;
    padding: 6px 8px;
    z-index: 100;
  }
  .zoom-controls button {
    width: 28px;
    height: 28px;
    background: rgba(255, 255, 255, 0.06);
    border: none;
    border-radius: 6px;
    color: #fff;
    font-size: 16px;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .zoom-controls button:hover { background: rgba(255, 255, 255, 0.14); }
  .zoom-controls .level {
    color: #cfcfd3;
    font-size: 12px;
    min-width: 44px;
    text-align: center;
  }
  /* ===== 纵向布局：顶部状态面板 + 下方菜单 ===== */
  body { display: flex; flex-direction: column; }
  .clickgui { height: auto; flex: 1 1 auto; min-height: 0; }

  /* ===== 顶部状态面板 ===== */
  .status-panel {
    position: relative;
    z-index: 1;
    flex: none;
    width: min(960px, calc(100% - 40px));
    margin: 22px auto 0;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  /* 成功进入状态条 */
  .status-bar {
    display: flex;
    align-items: center;
    gap: 14px;
    background: rgba(26, 26, 29, 0.86);
    border: 1px solid rgba(255, 255, 255, 0.07);
    border-radius: 16px;
    padding: 20px 28px;
  }
  .status-bar .ok-circle {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: linear-gradient(135deg, #8df5ab, #57e084);
    display: flex;
    align-items: center;
    justify-content: center;
    flex: none;
  }
  .status-bar .ok-circle svg { width: 20px; height: 20px; }
  .status-bar .ok-text { color: #fff; font-size: 19px; font-weight: 700; letter-spacing: .5px; }

  /* Hook 注入行 */
  .hook-row {
    display: flex;
    align-items: center;
    gap: 14px;
    background: rgba(26, 26, 29, 0.86);
    border: 1px solid rgba(255, 255, 255, 0.07);
    border-radius: 16px;
    padding: 18px 28px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .hook-row .apple-icon { display: flex; align-items: center; }
  .hook-row .apple-icon svg { width: 24px; height: 24px; }
  .hook-row .hook-name { color: #fff; font-size: 17px; font-weight: 600; }
  .hook-row .hook-pill {
    margin-left: auto;
    background: linear-gradient(90deg, #8df5ab, #57e084);
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    border-radius: 10px;
    padding: 8px 16px;
    white-space: nowrap;
  }
  .hook-row .hook-pill.loading { background: rgba(255, 255, 255, 0.12); color: #cfcfd3; }

  /* 设备字段区：竖列一行一个，无圆角卡片背景 */
  .device-fields {
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 4px 6px;
  }
  .field {
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: 12px;
  }
  .field .f-label { color: #c9c9d0; font-size: 11px; letter-spacing: .3px; width: 76px; flex: none; text-shadow: 0 1px 2px rgba(0,0,0,.75); }
  .field .f-value { color: #fff; font-size: 13px; font-weight: 600; word-break: break-all; text-shadow: 0 1px 2px rgba(0,0,0,.75); }
  .field .f-value.pending { color: #c2c2ca; }
  /* ===== 视图切换：主界面 / 菜单界面 ===== */
  .view { position: relative; z-index: 1; }
  .view.hidden { display: none !important; }

  /* 主界面：状态面板 + 底部预览菜单按钮 */
  #view-home {
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 22px 20px 30px;
  }
  #view-home .status-panel { margin: 0 auto; }

  .open-menu-btn {
    margin-top: 26px;
    background: linear-gradient(90deg, #8df5ab, #57e084);
    color: #06280f;
    border: none;
    border-radius: 12px;
    padding: 12px 24px;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: .5px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .open-menu-btn:hover { filter: brightness(1.06); }

  /* 菜单界面：渐入显现 */
  #view-menu { min-height: 100%; }
  #view-menu.enter { animation: menuFade .28s ease both; }
  @keyframes menuFade {
    from { opacity: 0; transform: scale(.96) translateY(14px); }
    to   { opacity: 1; transform: scale(1) translateY(0); }
  }

  .back-btn {
    position: fixed;
    left: 20px;
    bottom: 20px;
    z-index: 100;
    background: rgba(26, 26, 29, 0.86);
    border: 1px solid rgba(255, 255, 255, 0.07);
    color: #fff;
    border-radius: 10px;
    padding: 8px 14px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .back-btn:hover { background: rgba(255, 255, 255, 0.14); }
</style>
</head>
<body>

<div id="view-home" class="view">
<div class="status-panel">
  <div class="status-bar">
    <span class="ok-circle">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M5 12.5l4.2 4.2L19 7" stroke="#06280f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </span>
    <span class="ok-text">成功进入</span>
  </div>

  <div class="hook-row" id="hook-row">
    <span class="apple-icon">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path fill="#fff" d="M16.36 12.94c.03 2.98 2.61 3.97 2.64 3.99-.02.07-.41 1.41-1.36 2.8-.82 1.2-1.67 2.4-3.02 2.42-1.32.03-1.75-.78-3.26-.78-1.51 0-1.99.75-3.23.81-1.3.05-2.3-1.3-3.13-2.49-1.7-2.46-3.0-6.95-1.26-9.99.87-1.5 2.43-2.45 4.12-2.47 1.29-.03 2.5.87 3.26.87.76 0 2.21-1.07 3.73-.92.64.03 2.44.26 3.6 1.96-.09.06-2.15 1.26-2.13 3.75zM13.9 4.9c.69-.83 1.15-1.98 1.02-3.13-.99.04-2.19.66-2.9 1.49-.64.74-1.2 1.92-1.05 3.05 1.1.09 2.22-.56 2.93-1.41z"/></svg>
    </span>
    <span class="hook-name">Hook 注入</span>
    <span class="hook-pill" id="hook-pill">检测状态</span>
  </div>

  <div class="device-fields" id="device-fields">
    <div class="field"><span class="f-label">设备名称</span><span class="f-value pending" id="f-name">—</span></div>
    <div class="field"><span class="f-label">设备类型</span><span class="f-value pending" id="f-type">—</span></div>
    <div class="field"><span class="f-label">iOS版本</span><span class="f-value pending" id="f-ios">—</span></div>
    <div class="field"><span class="f-label">型号名称</span><span class="f-value pending" id="f-modelname">—</span></div>
    <div class="field"><span class="f-label">型号</span><span class="f-value pending" id="f-model">—</span></div>
    <div class="field"><span class="f-label">序列号</span><span class="f-value pending" id="f-serial">—</span></div>
    <div class="field"><span class="f-label">本机UDID</span><span class="f-value pending" id="f-udid">—</span></div>
  </div>
</div>

  <button class="open-menu-btn" id="open-menu-btn">预览菜单</button>
</div>

<div id="view-menu" class="view hidden">
  <div class="clickgui" id="clickgui"></div>

  <div class="zoom-controls">
    <button id="zoom-out" title="缩小">−</button>
    <span class="level" id="zoom-level">100%</span>
    <button id="zoom-in" title="放大">+</button>
    <button id="zoom-reset" title="重置">⟲</button>
  </div>

  <button class="back-btn" id="back-btn">返回</button>
</div>

<script>
  /* ===== 菜单数据：战斗 / 移动 / 视觉 / 漏洞 / 其他 ===== */
  const categories = [
    {
      name: "战斗", icon: "combat",
      modules: [
        { name: "Auto Clicker",  desc: "按设定频率自动点击", state: "off" },
        { name: "Reach",         desc: "延长攻击距离", state: "off" },
        { name: "Hitbox",        desc: "放大目标碰撞箱", state: "off" }
      ]
    },
    {
      name: "移动", icon: "movement",
      modules: [
        { name: "Fly",            desc: "创造模式飞行", state: "off" },
        { name: "No Slowdown",    desc: "使用物品时不减速", state: "off" },
        { name: "Anti Immobile",  desc: "免疫禁锢与定身", state: "off" },
        { name: "Sprint",         desc: "Automatically sprints（自动疾跑）", state: "on" }
      ]
    },
    {
      name: "视觉", icon: "visual",
      modules: [
        { name: "Hud Editor",      desc: "编辑游戏内 HUD 布局", state: "off" },
        { name: "Watermark",       desc: "客户端水印标识", state: "on" },
        { name: "Click Gui",       desc: "当前菜单界面", state: "on" },
        { name: "Auto Scale",      desc: "自动适配界面缩放", state: "off" },
        { name: "Interface",       desc: "界面主题样式", state: "partial" },
        { name: "Array List",      desc: "已开启模块列表显示", state: "partial" },
        { name: "Level Info",      desc: "等级信息展示", state: "partial" },
        { name: "Notifications",   desc: "消息通知提示", state: "partial" },
        { name: "Destroy Progress",desc: "方块破坏进度显示", state: "off" },
        { name: "ESP",             desc: "玩家轮廓透视", state: "off" },
        { name: "Block ESP",       desc: "方块轮廓透视", state: "off" },
        { name: "Motion Blur",     desc: "动态模糊效果", state: "off" },
        { name: "Animations",      desc: "自定义手持动画", state: "off" },
        { name: "No Camera Clip",  desc: "相机不被方块遮挡", state: "off" },
        { name: "Item Physics",    desc: "掉落物品物理效果", state: "off" },
        { name: "Target HUD",      desc: "目标玩家信息框", state: "off" },
        { name: "Item ESP",        desc: "掉落物透视", state: "off" },
        { name: "Nametags",        desc: "名牌信息强化显示", state: "off" },
        { name: "No Hurtcam",      desc: "关闭受击镜头晃动", state: "off" },
        { name: "Full Bright",     desc: "全局亮度拉满", state: "off" },
        { name: "Keystrokes",      desc: "按键按压显示", state: "off" },
        { name: "View Model",      desc: "手持物品视角调整", state: "off" }
      ]
    },
    {
      name: "漏洞", icon: "bug",
      modules: [
        { name: "Timer",            desc: "修改游戏时钟速度", state: "off" },
        { name: "Scaffold",         desc: "自动搭路放置方块", state: "off" },
        { name: "Derp",             desc: "玩家模型头部乱转", state: "off" },
        { name: "Freecam",          desc: "自由视角脱离本体", state: "off" },
        { name: "Device Spoof",     desc: "伪装设备标识信息", state: "off" },
        { name: "Anti Cheat Detector", desc: "检测服务器反作弊", state: "off" },
        { name: "No Packet",        desc: "屏蔽指定封包", state: "off" },
        { name: "Disabler",         desc: "禁用反作弊校验", state: "off" },
        { name: "Net Skip",         desc: "跳过网络延迟校验", state: "off" }
      ]
    },
    {
      name: "其他", icon: "player",
      modules: [
        { name: "Auto Spell Book", desc: "自动使用法术书", state: "off" },
        { name: "Anti Bot",        desc: "过滤服务器机器人", state: "partial" },
        { name: "Friends",         desc: "好友列表管理", state: "off" },
        { name: "Kick Sounds",     desc: "踢出玩家音效", state: "off" },
        { name: "Auto Queue",      desc: "自动排队进服", state: "off" },
        { name: "No Filter",       desc: "关闭聊天过滤", state: "pink" },
        { name: "Auto Message",    desc: "自动发送消息", state: "off" },
        { name: "Killsults",       desc: "击杀后自动嘲讽", state: "off" },
        { name: "Staff Alert",     desc: "管理员上线警报", state: "off" },
        { name: "Auto Cosmetic",   desc: "自动穿戴装饰", state: "off" },
        { name: "Auto Accept",     desc: "自动接受组队邀请", state: "off" },
        { name: "Party Spammer",   desc: "队伍频道刷屏", state: "off" },
        { name: "Spammer",         desc: "公屏自动刷屏", state: "off" },
        { name: "IRC",             desc: "内部聊天频道", state: "off" },
        { name: "Skin Stealer",    desc: "窃取他人皮肤", state: "off" },
        { name: "Auto Report",     desc: "自动举报可疑玩家", state: "off" }
      ]
    }
  ];

  /* ===== 渲染菜单 ===== */
  const ICONS = {"combat": "<svg viewBox=\"0 0 24 24\" xmlns=\"http://www.w3.org/2000/svg\"> <circle cx=\"10\" cy=\"14\" r=\"6.6\" fill=\"#fff\"/> <path d=\"M14.7 9.3 17.3 6.7\" stroke=\"#fff\" stroke-width=\"1.7\" stroke-linecap=\"round\"/> <path d=\"M17.3 6.7 19.1 5.3M17.3 6.7l2.1.4M17.3 6.7l.4 2\" stroke=\"#fff\" stroke-width=\"1.5\" stroke-linecap=\"round\"/> <circle cx=\"7.6\" cy=\"11.8\" r=\"1.2\" fill=\"#1a1a1d\"/> </svg>", "movement": "<svg viewBox=\"0 0 24 24\" xmlns=\"http://www.w3.org/2000/svg\"><circle cx=\"16\" cy=\"5.5\" r=\"2.1\" fill=\"#fff\"/><path d=\"M13.6 8.6 L10.2 13.8\" stroke=\"#fff\" stroke-width=\"4.8\" stroke-linecap=\"round\"/><path d=\"M13 9.2 C11 7.6 9 7.4 7.6 8.6\" stroke=\"#fff\" stroke-width=\"2.6\" stroke-linecap=\"round\" fill=\"none\"/><circle cx=\"8.8\" cy=\"16.1\" r=\"3.1\" fill=\"#fff\"/><circle cx=\"8.8\" cy=\"16.1\" r=\"1.75\" fill=\"#1a1a1d\"/><rect x=\"12.5\" y=\"12.8\" width=\"3.5\" height=\"6.4\" rx=\"1.5\" fill=\"#fff\"/><rect x=\"14\" y=\"13.8\" width=\"0.7\" height=\"4.6\" fill=\"#1a1a1d\"/></svg>", "player": "<svg viewBox=\"0 0 24 24\" xmlns=\"http://www.w3.org/2000/svg\"> <path fill=\"#fff\" d=\"M12,12c2.21,0 4-1.79 4-4s-1.79-4-4-4 -4,1.79-4,4 1.79,4 4,4zM12,14c-2.67,0 -8,1.34-8,4v2h16v-2c0-2.66-5.33-4-8-4z\"/> </svg>", "visual": "<svg viewBox=\"0 0 24 24\" xmlns=\"http://www.w3.org/2000/svg\"><path fill=\"#fff\" d=\"M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z\"/></svg>", "bug": "<svg viewBox=\"0 0 24 24\" xmlns=\"http://www.w3.org/2000/svg\"><g stroke=\"#fff\" stroke-width=\"2.4\" stroke-linecap=\"round\"><path d=\"M8.3 10.2 L5.6 8.2\"/><path d=\"M7.8 13 L5.2 13\"/><path d=\"M8.3 15.6 L5.6 17.4\"/><path d=\"M15.7 10.2 L18.4 8.2\"/><path d=\"M16.2 13 L18.8 13\"/><path d=\"M15.7 15.6 L18.4 17.4\"/></g><path d=\"M9.7 8.6 A2.3 2.3 0 0 1 14.3 8.6 Z\" fill=\"#fff\"/><rect x=\"7.5\" y=\"8.5\" width=\"9\" height=\"9.5\" rx=\"2.2\" fill=\"#fff\"/><rect x=\"11.65\" y=\"9.1\" width=\"0.7\" height=\"8.3\" fill=\"#1a1a1d\"/></svg>"};

  /* ===== Hook 注入：点击查询本机状态 ===== */
  const hookRow = document.getElementById("hook-row");
  const hookPill = document.getElementById("hook-pill");
  const fieldEls = {
    name: document.getElementById("f-name"),
    type: document.getElementById("f-type"),
    ios: document.getElementById("f-ios"),
    modelName: document.getElementById("f-modelname"),
    model: document.getElementById("f-model"),
    serial: document.getElementById("f-serial"),
    udid: document.getElementById("f-udid")
  };

  function readDeviceInfo() {
    const native = window.NATIVE_DEVICE || {};
    const ua = navigator.userAgent;
    let name = native.name || "—";
    let type = native.type || "—";
    let ios = native.ios || "—";
    let modelName = native.modelName || "—";
    let model = native.model || "—";
    let serial = native.serial || "—";
    let udid = native.udid || "—";

    // 无原生注入（浏览器预览）时回退 UA 解析
    if (type === "—") {
      const mIOS = ua.match(/OS (\d+)[-_](\d+)/);
      if (mIOS) ios = mIOS[1] + "." + mIOS[2];
      const mModel = ua.match(/(iPhone|iPad)[\d]+,[\d]+/);
      if (mModel) model = mModel[0];
      if (/iPad/.test(ua)) type = "iPad";
      else if (/iPhone/.test(ua)) type = "iPhone";
      else type = "Web 预览";
    }
    return { name, type, ios, modelName, model, serial, udid };
  }

  hookRow.addEventListener("click", () => {
    if (hookPill.classList.contains("loading")) return;
    hookPill.classList.add("loading");
    hookPill.textContent = "查询中…";

    setTimeout(() => {
      const info = readDeviceInfo();
      fieldEls.name.textContent = info.name;
      fieldEls.type.textContent = info.type;
      fieldEls.ios.textContent = info.ios;
      fieldEls.modelName.textContent = info.modelName;
      fieldEls.model.textContent = info.model;
      fieldEls.serial.textContent = info.serial;
      fieldEls.udid.textContent = info.udid;
      Object.values(fieldEls).forEach(el => el.classList.remove("pending"));
      hookPill.classList.remove("loading");
      hookPill.textContent = "已检测";
    }, 1200);
  });

  /* ===== 主界面 / 菜单界面切换 ===== */
  const viewHome = document.getElementById("view-home");
  const viewMenu = document.getElementById("view-menu");
  document.getElementById("open-menu-btn").addEventListener("click", () => {
    viewHome.classList.add("hidden");
    viewMenu.classList.remove("hidden");
    viewMenu.classList.remove("enter");
    void viewMenu.offsetWidth; // 重触发渐入动画
    viewMenu.classList.add("enter");
  });
  document.getElementById("back-btn").addEventListener("click", () => {
    viewMenu.classList.add("hidden");
    viewHome.classList.remove("hidden");
  });

  const root = document.getElementById("clickgui");

  /* ===== 菜单缩放：空白处滚轮 / +/- 键缩放，0 重置；列表内滚轮仍滚动 ===== */
  let scale = 1;
  const MIN_SCALE = 0.6, MAX_SCALE = 2.5, STEP = 0.1;
  const clampScale = v => Math.min(MAX_SCALE, Math.max(MIN_SCALE, v));
  const levelEl = document.getElementById("zoom-level");
  const applyZoom = () => {
    root.style.zoom = scale;
    levelEl.textContent = Math.round(scale * 100) + "%";
  };

  root.addEventListener("wheel", e => {
    if (e.ctrlKey) return;                 // 交给浏览器原生缩放
    if (e.target.closest(".module-list")) return; // 列表内部保留滚动
    e.preventDefault();
    scale = clampScale(scale + (e.deltaY < 0 ? STEP : -STEP));
    applyZoom();
  }, { passive: false });

  window.addEventListener("keydown", e => {
    if (e.key === "+" || e.key === "=")      scale = clampScale(scale + STEP);
    else if (e.key === "-")                  scale = clampScale(scale - STEP);
    else if (e.key === "0")                  scale = 1;
    else return;
    applyZoom();
  });

  /* 右下角按钮手动缩放 */
  document.getElementById("zoom-in").addEventListener("click", () => {
    scale = clampScale(scale + STEP); applyZoom();
  });
  document.getElementById("zoom-out").addEventListener("click", () => {
    scale = clampScale(scale - STEP); applyZoom();
  });
  document.getElementById("zoom-reset").addEventListener("click", () => {
    scale = 1; applyZoom();
  });

  categories.forEach(cat => {
    const panel = document.createElement("div");
    panel.className = "panel";

    const header = document.createElement("div");
    header.className = "panel-header";
    header.innerHTML = `<span class="icon">${ICONS[cat.icon]}</span><span>${cat.name}</span>`;
    panel.appendChild(header);

    const list = document.createElement("ul");
    list.className = "module-list";

    cat.modules.forEach(mod => {
      const li = document.createElement("li");
      li.className = "module" + (mod.state !== "off" ? " " + mod.state : "");
      li.dataset.state = mod.state;
      li.draggable = false;
      li.innerHTML = `${mod.name}<span class="tooltip">${mod.desc}</span>`;

      /* 禁止拖拽 */
      li.addEventListener("dragstart", e => e.preventDefault());

      /* 点击切换：off -> on -> off；关闭时彻底还原，不留高亮痕迹 */
      li.addEventListener("click", () => {
        const cur = li.dataset.state;
        const next = cur === "off" ? "on" : "off";
        li.dataset.state = next;
        if (next === "off") {
          li.className = "module";
          li.style.background = "";
          li.style.color = "";
          li.style.fontWeight = "";
        } else {
          li.className = "module " + next;
        }
      });

      list.appendChild(li);
    });

    panel.appendChild(list);
    root.appendChild(panel);
  });
</script>

</body>
</html>
